<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>Garage</title>
  <link rel="stylesheet" href="/garage/garage.css">
</head>

<!--
  ============================================================
  VARIANT B - LIVING STILL

  Expects one file:
    /garage/media/backdrop.jpg

  Nothing is generated. It is the real photograph, with three
  effects layered on it:
    - a 46 second zoom and drift (CSS, class "backdrop__media--drift")
    - a small parallax push following the cursor (backdrop.js)
    - film grain (backdrop.js)

  The drift speed is the --drift variable in garage.css. If it
  reads as "something is moving", it is too fast.
  ============================================================
-->

<body>
  <div class="backdrop" data-backdrop
       data-missing="no photo yet&#10;&#10;drop backdrop.jpg into /garage/media/">
    <div class="backdrop__parallax" data-parallax>
      <img class="backdrop__media backdrop__media--drift"
           src="/garage/media/backdrop.jpg"
           alt=""
           decoding="async">
    </div>
  </div>

  <canvas class="grain" data-grain aria-hidden="true"></canvas>

  <nav class="switch" aria-label="Backdrop variant">
    <a href="/garage/">Video</a>
    <a href="/garage/still.html" aria-current="page">Still</a>
  </nav>

  <main class="content">
    <p class="eyebrow">Placeholder copy</p>
    <h1 class="title">Put the headline here</h1>
    <p class="lede">
      And the sentence under it here. This block is deliberately plain -
      it is only present so the backdrop can be judged with text over it,
      which is the situation that actually matters.
    </p>
  </main>

  <script src="/garage/backdrop.js"></script>
</body>
</html>
